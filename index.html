<div class="sub">Experiments 1–3 • Concepts Only</div>

<br>✓ Circuit-specific questions such as “Circuit #1/#2/#3” and specific component values have been removed.

let qs=[];

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function resetExam(){
  qs=original.map(x=>[x[0],x[1],[...x[2]],x[3]]);
  // Shuffle questions within each part while keeping the three parts separated.
  const parts=[...new Set(qs.map(x=>x[0]))];
  let ordered=[];
  parts.forEach(p=>{
    const group=shuffle(qs.filter(x=>x[0]===p));
    ordered.push(...group);
  });
  qs=ordered;

  const form=document.getElementById("exam");
  form.innerHTML="";
  let n=1,lastPart="";
  qs.forEach((x,i)=>{
    if(x[0]!==lastPart){
      const h=document.createElement("div");
      h.className="section";
      h.textContent=x[0];
      form.appendChild(h);
      lastPart=x[0];
    }

    const card=document.createElement("div");
    card.className="q";
    card.dataset.i=i;

    let options=x[2].map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}"> ${esc(o)}</label>`).join("");

    card.innerHTML=`<div class="qtext">${n}. ${esc(x[1])}</div>${options}<div class="explain" id="e${i}"></div>`;
    form.appendChild(card);
    n++;
  });
  document.getElementById("result").textContent="";
  window.scrollTo({top:0,behavior:"smooth"});
}

function submitExam(){
  let score=0;
  qs.forEach((x,i)=>{
    const card=document.querySelector('.q[data-i="'+i+'"]');
    const labels=card.querySelectorAll(".option");
    const picked=card.querySelector("input:checked");

    labels.forEach((lab,k)=>{
      lab.classList.remove("correct","wrong");
      if(k===x[3]) lab.classList.add("correct");
    });

    const e=document.getElementById("e"+i);

    if(picked && Number(picked.value)===x[3]){
      score++;
      e.textContent="✓ Correct";
      e.style.color="#16803c";
    }else{
      if(picked) labels[Number(picked.value)].classList.add("wrong");
      e.textContent="✗ Correct answer: "+x[2][x[3]];
      e.style.color="#b42318";
    }
  });

  const pct=Math.round(score/qs.length*100);
  document.getElementById("result").textContent=`Score: ${score} / ${qs.length} (${pct}%)`;
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

document.getElementById("submit").onclick=submitExam;
document.getElementById("reset").onclick=resetExam;
resetExam();
</script>
</body>
</html>
